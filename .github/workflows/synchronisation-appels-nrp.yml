name: Actualisation ciblée appels et NRP

on:
  workflow_dispatch:
  schedule:
    # Été (Paris) : 06:20, 08:20, 10:20, 12:20, 14:20, 16:20 et 18:20.
    # La collecte dure environ 45 minutes ; ce rythme garde les indicateurs
    # NRP à jour pendant la journée sans retraiter le tunnel ni le calendrier.
    - cron: "20 4-16/2 * * 1-6"

concurrency:
  group: synchronisation-appels-nrp
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRM_STORAGE_STATE_B64: ${{ secrets.CRM_STORAGE_STATE_B64 }}
      CRM_LOGIN_EMAIL: ${{ secrets.CRM_LOGIN_EMAIL }}
      CRM_LOGIN_PASSWORD: ${{ secrets.CRM_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sync_worker/requirements-sync.txt
      - run: pip install -r sync_worker/requirements-sync.txt
      - run: playwright install --with-deps chromium
      - name: Restaurer les données publiées
        run: python sync_worker/export_supabase_to_sqlite.py
      - name: Actualiser uniquement les appels et NRP
        run: python sync_worker/crm_sync.py --existing-only
      - name: Publier les données actualisées
        run: python sync_worker/migrate_sqlite_to_supabase.py --replace sync_worker/data/leads.sqlite
      - name: Conserver la reprise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reprise-appels-nrp
          path: sync_worker/data/leads.sqlite
          if-no-files-found: error
          retention-days: 14
