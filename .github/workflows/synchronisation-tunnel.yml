name: Mise à jour rapide du tunnel commercial

on:
  workflow_dispatch:

concurrency:
  group: synchronisation-crm-supabase
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRM_STORAGE_STATE_B64: ${{ secrets.CRM_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sync_worker/requirements-sync.txt
      - run: pip install -r sync_worker/requirements-sync.txt
      - run: playwright install --with-deps chromium
      - name: Restaurer les données existantes
        run: python sync_worker/export_supabase_to_sqlite.py
      - name: Photographier le tunnel commercial complet
        run: python sync_worker/funnel_sync.py
      - name: Envoyer vers Supabase
        run: python sync_worker/migrate_sqlite_to_supabase.py --replace sync_worker/data/leads.sqlite
