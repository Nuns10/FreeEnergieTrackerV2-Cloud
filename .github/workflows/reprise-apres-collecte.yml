name: Reprise après collecte sauvegardée

on:
  workflow_dispatch:

concurrency:
  group: synchronisation-crm-supabase
  cancel-in-progress: false

jobs:
  reprendre:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRM_STORAGE_STATE_B64: ${{ secrets.CRM_STORAGE_STATE_B64 }}
      CRM_LOGIN_EMAIL: ${{ secrets.CRM_LOGIN_EMAIL }}
      CRM_LOGIN_PASSWORD: ${{ secrets.CRM_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sync_worker/requirements-sync.txt
      - run: pip install -r sync_worker/requirements-sync.txt
      - run: playwright install --with-deps chromium
      - name: Récupérer la collecte complète déjà effectuée
        uses: actions/download-artifact@v4
        with:
          name: diagnostic-crm-cloud
          path: reprise
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33756516058
      - name: Restaurer la base sauvegardée
        run: |
          mkdir -p sync_worker/data
          saved_db="$(find reprise -type f -name leads.sqlite -print -quit)"
          test -n "$saved_db"
          cp "$saved_db" sync_worker/data/leads.sqlite
      - name: Synchroniser uniquement les leads et appels
        run: python sync_worker/crm_sync.py
      - name: Envoyer vers Supabase
        run: python sync_worker/migrate_sqlite_to_supabase.py --replace sync_worker/data/leads.sqlite
      - name: Conserver la reprise en cas d'erreur
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-reprise-crm
          path: |
            sync_worker/diagnostic_cloud/
            sync_worker/data/leads.sqlite
          if-no-files-found: ignore
          retention-days: 14
