name: Synchronisation CRM vers Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: synchronisation-crm-supabase
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRM_STORAGE_STATE_B64: ${{ secrets.CRM_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sync_worker/requirements-sync.txt
      - run: pip install -r sync_worker/requirements-sync.txt
      - run: playwright install --with-deps chromium
      - name: Restaurer les données existantes
        run: python sync_worker/export_supabase_to_sqlite.py
      - name: Synchroniser les leads et appels
        run: python sync_worker/crm_sync.py
      - name: Synchroniser les calendriers récents
        run: python sync_worker/calendar_sync.py --weeks-back 2
      - name: Envoyer vers Supabase
        run: python sync_worker/migrate_sqlite_to_supabase.py --replace sync_worker/data/leads.sqlite
      - name: Conserver le diagnostic en cas d'erreur
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-crm-cloud
          path: sync_worker/diagnostic_cloud/
          if-no-files-found: ignore
